name: CodeQL

# This repo has no CodeQL-supported source language (Helm charts are YAML and
# Go templates), so only the GitHub Actions workflows are scanned. PRs and
# pushes run only when a workflow or local action changes; the weekly run
# picks up new CodeQL queries.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  schedule:
    - cron: "0 5 * * 5"

permissions: {}

jobs:
  codeql:
    uses: cmu-sei/Crucible-Github-Actions/.github/workflows/codeql.yaml@codeql-v1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: actions

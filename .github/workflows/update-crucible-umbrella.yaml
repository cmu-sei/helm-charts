name: Update Crucible Umbrella Chart

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  update-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: "v4.3.1"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq yq

      - name: Add Helm repositories
        run: |
          helm repo add cmusei https://cmu-sei.github.io/helm-charts
          helm repo update

      - name: Run update script
        id: update
        run: |
          .github/scripts/update-crucible-umbrella.sh

          # Check if there were any changes
          if git diff --quiet charts/crucible-apps/Chart.yaml charts/crucible-apps/Chart.lock; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected"
          fi

      - name: Increment chart version
        if: steps.update.outputs.has_changes == 'true'
        id: version
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          cd charts/crucible-apps

          # Get current version
          CURRENT_VERSION=$(yq -r .version Chart.yaml)
          echo "Current version: $CURRENT_VERSION"

          # Parse version
          IFS='.' read -r -a version_parts <<< "$CURRENT_VERSION"
          MAJOR="${version_parts[0]}"
          MINOR="${version_parts[1]}"
          PATCH="${version_parts[2]}"

          # Increment based on input
          case "$VERSION_BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          # Update Chart.yaml version
          sed -i "s/^version: .*/version: $NEW_VERSION/" Chart.yaml

      # Push the update to a branch named for the new version, then open a PR
      # for it. If that PR is already open, the force-push updates it instead.
      - name: Create Pull Request
        if: steps.update.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          VERSION_BUMP: ${{ inputs.version_bump }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          BRANCH="crucible-umbrella-$NEW_VERSION"
          TITLE="Crucible Umbrella to $NEW_VERSION"
          BODY="Automated update of Crucible umbrella chart to version $NEW_VERSION.

          - Updated all CMU SEI chart dependencies to latest versions
          - Bumped umbrella chart version ($VERSION_BUMP bump)
          - Regenerated Chart.lock file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add charts/crucible-apps/Chart.yaml charts/crucible-apps/Chart.lock
          git commit -m "update crucible umbrella chart to $NEW_VERSION"
          git push --force-with-lease origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "$BASE_BRANCH" --head "$BRANCH" --title "$TITLE" --body "$BODY"
          else
            echo "PR for $BRANCH already open; the push updated it."
          fi

      - name: No changes needed
        if: steps.update.outputs.has_changes == 'false'
        run: |
          echo "All charts are already up to date. No PR created."

image:
  repository: cmusei/vm-api
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # If name is not set and create is true,
  # a name is generated using the fullname template
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# iso - an NFS volume mount for ISO uploads, used when a hypervisor writes ISOs directly to a
# share rather than pushing them through its API (Vsphere__IsoUploadViaApi / Proxmox__IsoUploadViaApi
# false). Point mountPath at, or above, the ISO root(s) configured in env below:
#   vSphere only  - mountPath /app/isos/player, path being the export behind the vCenter datastore
#   Proxmox only  - mountPath /app/isos/proxmox, path being the export behind <IsoStorage>/template/iso,
#                   and set Proxmox__IsoRoot to the same mountPath
#   both, one export registered in vCenter *and* PVE - mountPath /app/isos, with
#                   Vsphere__IsoRoot /app/isos/player and Proxmox__IsoRoot /app/isos/template/iso
# Two separate exports need a second volume; see extraVolumes below.
iso:
  enabled: false
  size: ""
  server: ""
  path: ""
  mountPath: "/app/isos/player"

probes:
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 15
    failureThreshold: 5
    successThreshold: 1

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 15
    failureThreshold: 5
    successThreshold: 1

  startupProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 15
    failureThreshold: 15
    successThreshold: 1

ingress:
  enabled: true
  className: ""
  # Default annotations target nginx-ingress. The use-regex flag is required
  # for the regex-style ImplementationSpecific path below to actually match;
  # without it, nginx treats the parens as literal characters.
  annotations:
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  hosts:
    - host: chart-example.local
      paths:
        - path: /(notifications|hubs|api|swagger)
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# VM-API deployment adds a second ingress
# - This ingress is used as a proxy for getting a websocket
#   console connection to vCenter hosts.
# - TLS and Host URLs need configured, but the snippet should be left alone
# NOTES:
# - This is only used if RewriteHost__RewriteHost below is true, otherwise
#   connections will go directly from the UI to the vCenter hosts themselves
# - The host value here corresponds to RewriteHost__RewriteHostUrl below
consoleIngress:
  deployConsoleProxy: false
  className: ""
  name: player-connect
  annotations:
    nginx.ingress.kubernetes.io/server-snippet: |
      location /ticket {
          proxy_pass https://$arg_vmhost$uri;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_request_buffering off;
          proxy_buffering off;
          proxy_ssl_session_reuse on;
      }
  hosts:
    - host: chart-example.local
      paths: []
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# If this deployment needs to trust non-public certificates,
# create a configMap with the needed certificates and specify
# the configMap name here
certificateMap: ""

## extraVolumeMounts and Volumes is stringified YAML of kubernetes volume definitions
# Example use to add a second ISO share, when vSphere and Proxmox write to different NFS
# exports (the iso volume above serves the first one):
#
# extraVolumes: |
#   - name: "pve-iso-vol"
#     nfs:
#       server: "pve-nfs.example.com"
#       path: "/exports/pve-iso/template/iso"
#
# extraVolumeMounts: |
#   - name: "pve-iso-vol"
#     mountPath: /app/isos/proxmox
#
# Example use to give Vsphere__IsoUploadViaApi / Proxmox__IsoUploadViaApi somewhere to stage the
# local copy they make of each ISO. Size it for the largest ISO you expect to accept
# (IsoUpload__MaxFileSize) and point IsoUpload__TempStagingPath at the mountPath, otherwise
# that copy is written to the pod's filesystem:
#
# extraVolumes: |
#   - name: "iso-staging-vol"
#     emptyDir:
#       sizeLimit: "8Gi"
#
# extraVolumeMounts: |
#   - name: "iso-staging-vol"
#     mountPath: /app/iso-staging
#
# See kubernetes documentation for configuring your volumes:
# https://kubernetes.io/docs/concepts/storage/volumes/
extraVolumeMounts: ""
extraVolumes: ""

command: ["dotnet", "Player.Vm.Api.dll"]

## existingSecret references a secret already in k8s.
## The key/value pairs in the secret are added as environment variables.
existingSecret: ""

## extraEnvFrom injects additional envFrom sources (secrets or configmaps) into the API container.
## Useful for mounting externally managed secrets.
## Each entry follows the Kubernetes envFrom spec (secretRef or configMapRef).
extraEnvFrom: []
# - secretRef:
#     name: my-secret
# - configMapRef:
#     name: my-configmap

# Config app settings with environment vars.
# Those most likely needing values are listed. For others,
# see https://github.com/cmu-sei/Vm.Api/blob/main/src/Player.Vm.Api/appsettings.json
env:
  ## If hosting in virtual directory, specify path base
  PathBase: ""

  Logging__IncludeScopes: false
  Logging__Debug__LogLevel__Default: Information
  Logging__Debug__LogLevel__Microsoft: Error
  Logging__Debug__LogLevel__System: Error
  Logging__Console__LogLevel__Default: Information
  Logging__Console__LogLevel__Microsoft: Error
  Logging__Console__LogLevel__System: Error

  # database requires the 'uuid-ossp' extension installed
  ConnectionStrings__PostgreSQL: ""
  Database__AutoMigrate: true
  Database__DevModeRecreate: false
  Database__Provider: PostgreSQL

  # CorsPolicy__Origins__0: ""
  # CorsPolicy__Methods__0: ""
  # CorsPolicy__Headers__0: ""
  CorsPolicy__AllowAnyOrigin: false
  CorsPolicy__AllowAnyMethod: true
  CorsPolicy__AllowAnyHeader: true
  CorsPolicy__SupportsCredentials: true

  Authorization__Authority: ""
  Authorization__AuthorizationUrl: ""
  Authorization__TokenUrl: ""
  Authorization__AuthorizationScope: "vm-api player-api"
  Authorization__ClientId: vm-api-dev
  Authorization__ClientName: "VM API"
  Authorization__ClientSecret: ""
  Authorization__RequireHttpsMetaData: false

  ClaimsTransformation__EnableCaching: true
  ClaimsTransformation__CacheExpirationSeconds: 60

  # The shared ISO upload pipeline. Where the bytes end up is per-provider: Vsphere__IsoRoot /
  # Vsphere__IsoUploadViaApi below, and Proxmox__IsoRoot / Proxmox__IsoUploadViaApi.
  IsoUpload__MaxFileSize: 6000000000
  # Where IsoUploadViaApi stages its local copy of each ISO. Empty means the system temp directory,
  # which is the pod's own filesystem; see extraVolumes above for mounting scratch space instead.
  IsoUpload__TempStagingPath: ""
  IsoUpload__UploadTimeoutMinutes: 60

  IdentityClient__TokenUrl: ""
  IdentityClient__ClientId: "player-vm-admin"
  IdentityClient__Scope: "player-api vm-api"
  IdentityClient__Username: ""
  IdentityClient__Password: ""
  IdentityClient__MaxRetryDelaySeconds: 120
  IdentityClient__TokenRefreshSeconds: 600

  # Crucible Player URL
  ClientSettings__urls__playerApi: ""

  Vsphere__Host: ""
  # Where vSphere ISOs are written. IsoRoot is a path under the iso volume's mountPath above, on an
  # export that is also a vCenter NFS datastore; set IsoUploadViaApi true instead where there is no
  # such datastore to mount (VMware Cloud on AWS), and no iso volume is needed.
  #
  # Both modes use one datastore layout: "[<DsName>] <BaseFolder>/<viewId>/<scopeId>/<file>.iso", written
  # to every enabled host in API mode. Listing browses the datastore in BOTH modes, so IsoRoot has to be
  # the directory that surfaces at "[<DsName>] <BaseFolder>" or uploads succeed and then list empty.
  # See the ISO Upload section of the player chart README.
  Vsphere__IsoRoot: "/app/isos/player"
  Vsphere__IsoUploadViaApi: false
  Vsphere__Username: ""
  Vsphere__Password: ""
  Vsphere__DsName: ""
  Vsphere__BaseFolder: "player"
  Vsphere__Timeout: 30
  Vsphere__ConnectionRetryIntervalSeconds: 60
  Vsphere__ConnectionRefreshIntervalMinutes: 20
  Vsphere__LoadCacheAfterMinutes: 5
  Vsphere__ConnectionTimeoutSeconds: 90
  Vsphere__LogConsoleAccess: false
  Vsphere__CheckTaskProgressIntervalMilliseconds: 5000
  Vsphere__ReCheckTaskProgressIntervalMilliseconds: 1000
  Vsphere__HealthAllowanceSeconds: 180

  RewriteHost__RewriteHost: false
  RewriteHost__RewriteHostUrl: ""
  RewriteHost__RewriteHostQueryParam: "vmhost"

  # Open Telemetry
  # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

  # These settings toggle ServiceDefaults configurations for Otel
  OpenTelemetry__AddAlwaysOnTracingSampler: false
  OpenTelemetry__AddConsoleExporter: false
  OpenTelemetry__AddPrometheusExporter: false
  OpenTelemetry__IncludeDefaultActivitySources: true
  OpenTelemetry__IncludeDefaultMeters: true

  # Optional: force HTTP instead of the default gRPC protocol
  # OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  # Optional: override the service name reported to collectors
  # OTEL_SERVICE_NAME: vm-api

  Vsphere__SkipGuestFileCertificateValidation: false
  Vsphere__GuestFileTransferTimeoutMinutes: 3
  Vsphere__TaskTimeoutMinutes: 10
  Vsphere__TaskInfoUnavailableTimeoutSeconds: 30
  Vsphere__GuestProcessTempPath: ""
  Vsphere__GuestProcessDefaultTimeoutSeconds: 300
  # Proxmox VE. Can be configured alongside vSphere in the same instance.
  Proxmox__Enabled: false
  Proxmox__Host: ""
  Proxmox__Port: 8006
  Proxmox__Token: ""
  Proxmox__ValidateCertificate: true
  Proxmox__StateRefreshIntervalSeconds: 5
  Proxmox__CheckTaskProgressIntervalMilliseconds: 5000
  Proxmox__ReCheckTaskProgressIntervalMilliseconds: 1000
  Proxmox__FileUploadMaxBytes: 61440
  Proxmox__GuestProcessPollMs: 500
  Proxmox__GuestProcessDefaultTimeoutSeconds: 300
  # View/team-scoped ISO storage. Set IsoStorage to turn Proxmox ISO support on; clear it to turn it off.
  # It names a PVE storage that accepts ISO images, and IsoRoot must be a mount of that same storage's
  # template/iso directory - the layout PVE itself imposes, so an NFS export of it is mounted as e.g.
  # /app/isos/proxmox via the iso volume above. Set IsoUploadViaApi true to push each ISO through the PVE
  # API instead, which needs no mount but stages a local copy first (IsoUpload__TempStagingPath).
  # Proxmox storage is a flat namespace, so IsoScopeSeparator is what keeps one View or team's ISOs
  # distinct from another's within it; changing it hides ISOs uploaded under the previous value.
  Proxmox__IsoStorage: ""
  Proxmox__IsoUploadViaApi: false
  Proxmox__IsoRoot: ""
  Proxmox__IsoScopeSeparator: "__"

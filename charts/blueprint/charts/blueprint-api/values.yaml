image:
  repository: cmusei/blueprint-api
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # If name is not set and create is true,
  # a name is generated using the fullname template
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

probes:
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 15
    failureThreshold: 5
    successThreshold: 1

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 15
    failureThreshold: 5
    successThreshold: 1

  startupProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 15
    failureThreshold: 15
    successThreshold: 1

ingress:
  enabled: true
  className: ""
  # Default annotations target nginx-ingress. The use-regex flag is required
  # for the regex-style ImplementationSpecific path below to actually match;
  # without it, nginx treats the parens as literal characters.
  annotations:
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/use-regex: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /(api|swagger|hubs)
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# If this deployment needs to trust non-public certificates,
# create a configMap with the needed certificates and specify
# the configMap name here
certificateMap: ""

command: ["./Blueprint.Api"]

## existingSecret references a secret already in k8s.
## The key/value pairs in the secret are added as environment variables.
existingSecret: ""

## extraEnvFrom injects additional envFrom sources (secrets or configmaps) into the API container.
## Useful for mounting externally managed secrets.
## Each entry follows the Kubernetes envFrom spec (secretRef or configMapRef).
extraEnvFrom: []
# - secretRef:
#     name: my-secret
# - configMapRef:
#     name: my-configmap

# Config app settings with environment vars.
# Those most likely needing values are listed. For others,
# see https://github.com/cmu-sei/Blueprint.Api/blob/main/Blueprint.Api/appsettings.json
env:
  Logging__IncludeScopes: false
  Logging__Debug__LogLevel__Default: Warning
  Logging__Debug__LogLevel__Microsoft: Warning
  Logging__Debug__LogLevel__System: Warning
  Logging__Console__LogLevel__Default: Warning
  Logging__Console__LogLevel__Microsoft: Warning
  Logging__Console__LogLevel__System: Warning

  # database requires the 'uuid-ossp' extension installed
  ConnectionStrings__PostgreSQL: ""
  Database__AutoMigrate: true
  Database__DevModeRecreate: false
  Database__Provider: PostgreSQL
  Database__SeedFile: seed-data.json

  # CorsPolicy__Origins__0: ""
  # CorsPolicy__Methods__0: ""
  # CorsPolicy__Headers__0: ""
  CorsPolicy__AllowAnyOrigin: false
  CorsPolicy__AllowAnyMethod: true
  CorsPolicy__AllowAnyHeader: true
  CorsPolicy__SupportsCredentials: true

  Authorization__Authority: ""
  Authorization__AuthorizationUrl: ""
  Authorization__TokenUrl: ""
  Authorization__AuthorizationScope: "blueprint"
  Authorization__ClientId: blueprint.swagger
  Authorization__ClientName: "Blueprint API Swagger"
  Authorization__ClientSecret: ""
  Authorization__RequireHttpsMetaData: false

  ClaimsTransformation__EnableCaching: true
  ClaimsTransformation__CacheExpirationSeconds: 60

  XApiOptions__Enabled: false
  XApiOptions__Endpoint: ""
  XApiOptions__Username: ""
  XApiOptions__Password: ""
  XApiOptions__IssuerUrl: ""
  XApiOptions__ApiUrl: ""
  XApiOptions__UiUrl: ""
  XApiOptions__EmailDomain: ""
  XApiOptions__Platform: "Blueprint"
  XApiOptions__RetentionDays: 7
  XApiOptions__ProcessingTimeoutMinutes: 10
  XApiOptions__ProcessingDelaySeconds: 30
  # Most LRS statements the Assessor View reads per registration; paging stops there with a warning
  XApiOptions__MaxStatementsPerRegistration: 5000

  # Open Telemetry
  # OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

  # These settings toggle ServiceDefaults configurations for Otel
  OpenTelemetry__AddAlwaysOnTracingSampler: false
  OpenTelemetry__AddConsoleExporter: false
  OpenTelemetry__AddPrometheusExporter: false
  OpenTelemetry__IncludeDefaultActivitySources: true
  OpenTelemetry__IncludeDefaultMeters: true

  # Optional: force HTTP instead of the default gRPC protocol
  # OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  # Optional: override the service name reported to collectors
  # OTEL_SERVICE_NAME: blueprint-api

  # Caster integration
  # Base URL for the Caster API. Leave unset unless using Caster; an empty value breaks the MSEL endpoints.
  # ClientSettings__CasterApiUrl: https://caster.example.com/api/
  ClientSettings__CasterUiUrl: ""
  ClientSettings__VmUiUrl: ""
  # Seconds between Caster run status checks
  ClientSettings__CasterCheckIntervalSeconds: 10
  # Minutes to wait for a Caster plan, apply, or destroy to finish
  ClientSettings__CasterPlanMaxWaitMinutes: 15
  ClientSettings__CasterApplyMaxWaitMinutes: 120
  ClientSettings__CasterDestroyMaxWaitMinutes: 60
  # Automation tasks: Blueprint runs a MSEL's automation tasks itself (it no longer pushes them to Steamfitter)
  # Base URL of the Player VM API, for VM actions, ending in a slash (https://crucible.example.com/vm/): without one
  # its last path segment is dropped
  ClientSettings__PlayerVmApiUrl: ""
  # Run tasks on this replica. The SignalR hub is not shared between replicas, so run them on one only.
  Automation__WorkerEnabled: true
  Automation__MaxConcurrentRuns: 8
  Automation__MaxConcurrentVmOperationsPerRun: 8
  Automation__SchedulerIntervalSeconds: 2
  Automation__LeaseSeconds: 60
  Automation__DefaultExpirationSeconds: 300
  Automation__MaxExpirationSeconds: 3600
  # A task at its event time that could not start within this many seconds is recorded as skipped
  Automation__MissedScheduleGraceSeconds: 300
  Automation__MaxOutputBytes: 65536
  Automation__MaxVmsPerTask: 50
  Automation__TestRunsKeptPerTask: 20
  # Keys that encrypt task secrets (passwords, private keys, http headers): an id and 32 random bytes, base64
  # (openssl rand -base64 32). Set them in existingSecret, not here. Without one, a task with a secret cannot be saved.
  # Automation__SecretKeys__k1: ""
  # The key new secrets use; the first key id in order when unset. Keep old keys while secrets written with them remain.
  # Automation__ActiveSecretKeyId: k1
  # Hosts an http task may reach (wildcards like *.example.com); the Crucible APIs Blueprint is configured with when none
  # Automation__Http__AllowedHosts__0: ""
  # Hosts an http task sends Blueprint's service account token to; none when unset. Blueprint's own API never gets it.
  # Automation__Http__TokenHosts__0: ""
  Automation__Http__AllowLoopbackAddresses: false
  Automation__Http__TimeoutSeconds: 90
  # Hosts an SSH task may reach; none are allowed when none are set
  # Automation__Ssh__AllowedHosts__0: ""
  Automation__Ssh__CommandTimeoutSeconds: 60
  # The mail server email tasks send through
  Automation__Email__SmtpHost: ""
  Automation__Email__SmtpPort: 587
  Automation__Email__UseStartTls: true
  Automation__Email__SmtpUsername: ""
  Automation__Email__DefaultFromAddress: ""
  # The directory a file upload task reads from; uploads are refused when it is unset
  Automation__Files__LocalDirectory: ""

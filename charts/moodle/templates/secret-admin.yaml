{{- $moodle := .Values.moodle | default dict }}
{{- $admin := $moodle.admin | default dict }}
{{- $smtp := $moodle.smtp | default dict }}
{{- $adminPassword := not $admin.existingSecret }}
{{- $smtpPassword := and $smtp.password (not $smtp.existingSecret) }}
{{- if or $adminPassword $smtpPassword }}
{{- $secretName := include "moodle.smtp.secretName" . }}
{{- $secretKey := $admin.existingSecretKey | default "admin-password" }}
{{- $password := "" }}
{{- if $adminPassword }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and (hasKey $admin "password") (ne ($admin.password | toString) "") }}
  {{- $password = $admin.password }}
{{- else if and $existingSecret (hasKey $existingSecret.data $secretKey) }}
  {{- $password = index $existingSecret.data $secretKey | b64dec }}
{{- else }}
  {{- $password = randAlphaNum 16 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "moodle.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- if $adminPassword }}
  {{ $secretKey }}: {{ $password | quote }}
  {{- end }}
  {{- if $smtpPassword }}
  smtp-password: {{ $smtp.password | quote }}
  {{- end }}
{{- end }}

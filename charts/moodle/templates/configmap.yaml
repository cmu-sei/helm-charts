{{- $configMaps := .Values.configMaps | default dict }}
{{- range $name, $configMap := $configMaps }}
{{- if $configMap.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "moodle.fullname" $ }}-{{ $name }}
  labels:
    {{- include "moodle.labels" $ | nindent 4 }}
  {{- with $.Values.commonAnnotations }}
  annotations:
    {{- include "moodle.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
data:
  {{- toYaml $configMap.data | nindent 2 }}
{{- end }}
{{- end }}

---
{{- $moodle := .Values.moodle | default dict }}
{{- $oidc := $moodle.oidc | default dict }}
{{- $preset := $moodle.preset | default dict }}
{{- $scripts := or $oidc.enabled $moodle.postConfigureCommands $moodle.config $moodle.plugins $moodle.enabledPlugins $preset.name $preset.xml $preset.existingConfigMap ($moodle.redis | default dict).host }}
{{- if $scripts }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "moodle.fullname" . }}-oidc
  labels:
    {{- include "moodle.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- include "moodle.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
data:
  configure_oidc.sh: {{ .Files.Get "files/configure_oidc.sh" | quote }}
  setup_environment.php: {{ .Files.Get "files/setup_environment.php" | quote }}
  place_plugins.php: {{ .Files.Get "files/place_plugins.php" | quote }}
  key.svg: {{ .Files.Get "files/key.svg" | quote }}
  {{- with $moodle.plugins }}
  plugins.json: {{ toJson (fromYamlArray (tpl (toYaml .) $)) | quote }}
  {{- end }}
  {{- with $moodle.enabledPlugins }}
  enabled-plugins.json: {{ toJson . | quote }}
  {{- end }}
  {{- with $preset.xml }}
  preset.xml: {{ tpl . $ | quote }}
  {{- end }}
  {{- if $moodle.config }}
  {{- $split := fromYaml (include "moodle.config.split" $) }}
  {{- if $split.refs }}
  config-secrets.json: {{ toJson $split.refs | quote }}
  {{- end }}
  {{- end }}
{{- end }}

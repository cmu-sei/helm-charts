{{- include "moodle.validateValues" . -}}
{{- $autoscaling := .Values.autoscaling | default dict }}
{{- $podSecurityContext := .Values.podSecurityContext | default dict }}
{{- $containerSecurityContext := .Values.containerSecurityContext | default dict }}
{{- $containerPorts := .Values.containerPorts | default dict }}
{{- $nodeAffinityPreset := .Values.nodeAffinityPreset | default dict }}
{{- $moodle := .Values.moodle | default dict }}
{{- $webRoot := include "moodle.webRoot" . }}
{{- $oidc := $moodle.oidc | default dict }}
{{- $preset := $moodle.preset | default dict }}
{{- $presetKey := $preset.key | default "preset.xml" }}
{{- $presetFile := ternary (printf "/opt/sei/preset/%s" $presetKey) "/opt/sei/custom-scripts/preset.xml" (ne (toString ($preset.existingConfigMap | default "")) "") }}
{{- $presetWanted := or $preset.name $preset.xml $preset.existingConfigMap }}
{{- $scripts := or $oidc.enabled $moodle.postConfigureCommands $moodle.config $moodle.plugins $moodle.enabledPlugins $presetWanted ($moodle.redis | default dict).host }}
{{- $readOnlyDirroot := .Values.readOnlyDirroot | default dict }}
{{- $codeVolume := $readOnlyDirroot.enabled }}
{{- $postConfigure := or $oidc.enabled $moodle.postConfigureCommands $moodle.config $moodle.enabledPlugins $presetWanted (not $codeVolume) ($moodle.redis | default dict).host }}
{{- $multiPod := or (gt (.Values.replicaCount | default 1 | int) 1) $autoscaling.enabled }}
{{- $rollingUpdate := eq ((.Values.updateStrategy | default dict).type | default "RollingUpdate") "RollingUpdate" }}
{{- $maxPods := ternary ($autoscaling.maxReplicas | default 3 | int) (.Values.replicaCount | default 1 | int) (eq ($autoscaling.enabled | default false) true) }}
{{- $secretConfig := $readOnlyDirroot.secret | default dict }}
{{- $configKey := $secretConfig.key | default "config.php" }}
{{- $caBundle := .Values.caBundle | default dict }}
{{- $caBundleMount := or $caBundle.existingSecret $caBundle.existingConfigMap }}
{{- $caBundleKey := $caBundle.key | default "ca-certificates.crt" }}
{{- $oidcClientId := tpl ($oidc.clientId | default "") . }}
{{- $oidcName := tpl ($oidc.name | default "") . }}
{{- $oidcCaCert := $oidc.caCert | default dict }}
{{- $oidcCaCertMount := or $oidcCaCert.existingSecret $oidcCaCert.existingConfigMap }}
{{- $oidcCaCertEnabled := or $oidcCaCertMount $oidcCaCert.path }}
{{- $oidcCaCertPath := $oidcCaCert.path | default "/opt/sei/certs/oidc-ca.crt" }}
{{- $oidcCaCertKey := $oidcCaCert.key | default "ca.crt" }}
{{- $oidcExistingSecretKey := tpl ($oidc.existingSecretKey | default "client-secret") $ }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moodle.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "moodle.labels" . | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- include "moodle.tplvalues.render" (dict "value" $.Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  {{- if not $autoscaling.enabled }}
  replicas: {{ .Values.replicaCount | default 1 }}
  {{- end }}
  {{- if .Values.updateStrategy }}
  strategy:
    {{- if eq (.Values.updateStrategy.type | default "RollingUpdate") "Recreate" }}
    type: Recreate
    {{- else }}
    {{- toYaml .Values.updateStrategy | nindent 4 }}
    {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "moodle.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ printf "%s%s" (include (print $.Template.BasePath "/configmap.yaml") .) (include (print $.Template.BasePath "/secret-oidc.yaml") .) | sha256sum }}
        {{- if $codeVolume }}
        checksum/config-php: {{ include (print $.Template.BasePath "/secret-config.yaml") . | sha256sum }}
        {{- end }}
        {{- $moodle := .Values.moodle | default dict }}
        {{- $admin := $moodle.admin | default dict }}
        {{- $smtp := $moodle.smtp | default dict }}
        checksum/secrets: {{ printf "%s/%s" ($admin.password | default "") ($smtp.password | default "") | sha256sum }}
        {{- if .Values.podAnnotations }}
        {{- include "moodle.tplvalues.render" (dict "value" $.Values.podAnnotations "context" $) | nindent 8 }}
        {{- end }}
      labels:
        {{- include "moodle.selectorLabels" . | nindent 8 }}
        {{- if .Values.podLabels }}
        {{- include "moodle.tplvalues.render" (dict "value" $.Values.podLabels "context" $) | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- include "moodle.tplvalues.render" (dict "value" $.Values.imagePullSecrets "context" $) | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "moodle.serviceAccountName" . }}
      {{- if $podSecurityContext.enabled }}
      securityContext:
        {{- omit $podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      {{- $serviceAccount := .Values.serviceAccount | default dict }}
      automountServiceAccountToken: {{ $serviceAccount.automount | default false }}
      {{- if .Values.hostAliases }}
      hostAliases:
        {{- include "moodle.tplvalues.render" (dict "value" $.Values.hostAliases "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- include "moodle.tplvalues.render" (dict "value" $.Values.affinity "context" $) | nindent 8 }}
      {{- else if or .Values.podAffinityPreset .Values.podAntiAffinityPreset $nodeAffinityPreset.type }}
      affinity:
        {{- if .Values.podAffinityPreset }}
        podAffinity: {{- include "moodle.affinities.pods" (dict "type" .Values.podAffinityPreset "customLabels" (.Values.podLabels | default dict) "context" $) | nindent 10 }}
        {{- end }}
        {{- if .Values.podAntiAffinityPreset }}
        podAntiAffinity: {{- include "moodle.affinities.antiPods" (dict "type" .Values.podAntiAffinityPreset "customLabels" (.Values.podLabels | default dict) "context" $) | nindent 10 }}
        {{- end }}
        {{- if $nodeAffinityPreset.type }}
        nodeAffinity: {{- include "moodle.affinities.nodes" (dict "type" $nodeAffinityPreset.type "key" ($nodeAffinityPreset.key | default "") "values" ($nodeAffinityPreset.values | default list)) | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- include "moodle.tplvalues.render" (dict "value" $.Values.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- include "moodle.tplvalues.render" (dict "value" $.Values.tolerations "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.schedulerName }}
      schedulerName: {{ .Values.schedulerName }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- include "moodle.tplvalues.render" (dict "value" $.Values.topologySpreadConstraints "context" $) | nindent 8 }}
      {{- end }}
      {{- $persistence := .Values.persistence | default dict }}
      {{/* Above one pod localcachedir must be node-local, so force a per-pod emptyDir.
           A single pod may leave it inside moodledata. Injected here so the generic
           persistence loop below renders it like any other volume. */}}
      {{- if and (or $multiPod $rollingUpdate) (not ($persistence.localcache | default dict).enabled) }}
      {{- $_ := set $persistence "localcache" (dict "enabled" true "type" "emptyDir" "sizeLimit" "1Gi") }}
      {{- end }}
      {{- $volPerm := .Values.volumePermissions | default dict }}
      {{- $moodleVol := ($persistence.moodle | default dict).enabled }}
      {{- $psc := .Values.podSecurityContext | default dict }}
      {{- $vpUid := 65534 }}
      {{- $vpGid := 65534 }}
      {{- if and $containerSecurityContext.enabled $containerSecurityContext.runAsUser }}
      {{- $vpUid = $containerSecurityContext.runAsUser }}
      {{- else if and $psc.enabled $psc.runAsUser }}
      {{- $vpUid = $psc.runAsUser }}
      {{- end }}
      {{- if and $psc.enabled $psc.fsGroup }}
      {{- $vpGid = $psc.fsGroup }}
      {{- else if and $containerSecurityContext.enabled $containerSecurityContext.runAsGroup }}
      {{- $vpGid = $containerSecurityContext.runAsGroup }}
      {{- else if and $psc.enabled $psc.runAsGroup }}
      {{- $vpGid = $psc.runAsGroup }}
      {{- end }}
      {{- $vpWanted := ternary $volPerm.enabled true (hasKey $volPerm "enabled") }}
      {{- $needsChown := and $vpWanted (or $codeVolume $moodleVol) }}
      {{- if or .Values.initContainers $codeVolume $needsChown }}
      initContainers:
        {{- if $needsChown }}
        - name: volume-permissions
          image: {{ include "moodle.image" . }}
          imagePullPolicy: {{ include "moodle.imagePullPolicy" . }}
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -e
              {{- if $codeVolume }}
              echo "[volperm] chown -R {{ $vpUid }}:{{ $vpGid }} /seed"
              chown -R {{ $vpUid }}:{{ $vpGid }} /seed
              {{- end }}
              {{- if $moodleVol }}
              echo "[volperm] chown -R {{ $vpUid }}:{{ $vpGid }} /var/www/html"
              chown -R {{ $vpUid }}:{{ $vpGid }} /var/www/html
              {{- end }}
              echo "[volperm] done"
          volumeMounts:
            {{- if $codeVolume }}
            - name: dirroot
              mountPath: /seed
            {{- end }}
            {{- if $moodleVol }}
            - name: moodle
              mountPath: /var/www/html
            {{- end }}
        {{- end }}
        {{- if $codeVolume }}
        - name: seed-dirroot
          image: {{ include "moodle.image" . }}
          imagePullPolicy: {{ include "moodle.imagePullPolicy" . }}
          {{- if $containerSecurityContext.enabled }}
          securityContext:
            {{- omit $containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -e
              SRC=/usr/src/moodle
              [ -d "$SRC" ] || SRC=/var/www/html
              DST=/seed

              tree_version() {
                f="$1/public/version.php"
                [ -f "$f" ] || f="$1/version.php"
                [ -f "$f" ] || return 0
                sed -n 's/^\$version *= *\([0-9.]*\).*/\1/p' "$f" | head -1
              }

              img_ver=$(tree_version "$SRC" || true)
              if [ -z "$img_ver" ]; then
                echo "[ERROR] The image tree $SRC declares no \$version" >&2
                exit 1
              fi
              vol_ver=$(tree_version "$DST" || true)

              # The image's sync has no downgrade guard; the chart keeps one.
              if [ -n "$vol_ver" ] && [ "$vol_ver" != "$img_ver" ] && \
                 [ "$(printf '%s\n%s\n' "$vol_ver" "$img_ver" | sort -n | tail -1)" = "$vol_ver" ]; then
                echo "[ERROR] The volume holds Moodle $vol_ver and the image is $img_ver." >&2
                echo "[ERROR] Moodle has no down-migration. Roll image.tag forward, or restore" >&2
                echo "[ERROR] the database from backup and start from an empty dirroot volume." >&2
                exit 1
              fi

              # Core sync is the image's own script; needs volumePermissions.
              MOODLE_SRC_DIR="$SRC" MOODLE_HTML_DIR="$DST" \
                sh /docker-entrypoint-init.d/010-sync-moodle-code.sh

              WEBROOT_REL="{{ trimPrefix "/var/www/html" $webRoot }}"
              if [ -n "$WEBROOT_REL" ]; then
                if [ ! -d "$DST/public" ]; then
                  echo "[ERROR] The chart rendered webRoot {{ $webRoot }} from image.tag but the tree has no public directory" >&2
                  exit 1
                fi
              else
                if [ -d "$DST/public" ]; then
                  echo "[ERROR] The chart rendered webRoot {{ $webRoot }} from image.tag but the tree has a public directory" >&2
                  exit 1
                fi
              fi
              {{- if $moodle.plugins }}

              php /opt/sei/custom-scripts/place_plugins.php \
                  --root="$DST" --file=/opt/sei/custom-scripts/plugins.json
              {{- end }}
              {{- if $oidc.enabled }}

              # Moodle ships no pix/key.svg, so the icon is copied in.
              cp /opt/sei/custom-scripts/key.svg "$DST$WEBROOT_REL/pix/key.svg"
              {{- end }}

              rm -f "$DST/config.php"
              cp /opt/sei/config/{{ $configKey }} "$DST/config.php"
              chmod 0444 "$DST/config.php"
              echo "[init] Seed complete!"
          volumeMounts:
            - name: dirroot
              mountPath: /seed
            - name: config
              mountPath: /opt/sei/config
              readOnly: true
            {{- if $scripts }}
            - name: chart-scripts
              mountPath: /opt/sei/custom-scripts
              readOnly: true
            {{- end }}
            {{- if $caBundleMount }}
            - name: ca-bundle
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: {{ $caBundleKey }}
              readOnly: true
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- include "moodle.tplvalues.render" (dict "value" $.Values.extraVolumeMounts "context" $) | nindent 12 }}
            {{- end }}
        {{- end }}
        {{- if .Values.initContainers }}
        {{- include "moodle.tplvalues.render" (dict "value" $.Values.initContainers "context" $) | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: moodle
          image: {{ include "moodle.image" . }}
          imagePullPolicy: {{ include "moodle.imagePullPolicy" . }}
          {{- if $containerSecurityContext.enabled }}
          securityContext:
            {{- omit $containerSecurityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.command }}
          command:
            {{- toYaml .Values.command | nindent 12 }}
          {{- end }}
          {{- if .Values.args }}
          args:
            {{- toYaml .Values.args | nindent 12 }}
          {{- end }}
          env:
            {{- $moodle := $.Values.moodle | default dict }}
            {{- $admin := $moodle.admin | default dict }}
            {{- $site := $moodle.site | default dict }}
            {{- $proxy := $moodle.proxy | default dict }}
            {{- $database := $moodle.database | default dict }}
            {{- $php := $moodle.php | default dict }}
            {{- $smtp := $moodle.smtp | default dict }}
            {{- $mail := $moodle.mail | default dict }}
            {{- $redis := $moodle.redis | default dict }}
            - name: MOODLE_USERNAME
              value: {{ tpl ($admin.username | default "admin") $ | quote }}
            - name: MOODLE_EMAIL
              value: {{ tpl ($admin.email | default "admin@example.com") $ | quote }}
            - name: MOODLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if $admin.existingSecret }}
                  name: {{ tpl $admin.existingSecret $ }}
                  key: {{ $admin.existingSecretKey | default "admin-password" }}
                  {{- else }}
                  name: {{ include "moodle.admin.secretName" $ }}
                  key: {{ $admin.existingSecretKey | default "admin-password" }}
                  {{- end }}
            - name: SITE_URL
              value: {{ tpl ($site.url | default "http://localhost:8080") $ | quote }}
            - name: MOODLE_SITENAME
              value: {{ $site.name | default "Moodle" | quote }}
            - name: MOODLE_LANGUAGE
              value: {{ $site.language | default "en" | quote }}
            - name: REVERSEPROXY
              value: {{ $proxy.reverseProxy | default false | quote }}
            - name: SSLPROXY
              value: {{ ternary $proxy.sslProxy true (hasKey $proxy "sslProxy") | quote }}
            - name: DB_TYPE
              value: {{ $database.type | default "pgsql" | quote }}
            - name: DB_HOST
              value: {{ tpl ($database.host | default "pg-postgresql") $ | quote }}
            - name: DB_PORT
              value: {{ $database.port | default "5432" | quote }}
            - name: DB_NAME
              value: {{ $database.name | default "moodledb" | quote }}
            - name: DB_USER
              {{- if and $database.existingSecret $database.existingSecretUserKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ tpl $database.existingSecret $ }}
                  key: {{ $database.existingSecretUserKey }}
              {{- else }}
              value: {{ tpl ($database.user | default "moodle") $ | quote }}
              {{- end }}
            - name: DB_PREFIX
              value: {{ tpl ($database.prefix | default "mdl_") $ | quote }}
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  {{- if $database.existingSecret }}
                  name: {{ tpl $database.existingSecret $ }}
                  key: {{ $database.existingSecretPasswordKey | default "postgres-password" }}
                  {{- else }}
                  name: {{ include "moodle.database.secretName" $ }}
                  key: {{ $database.existingSecretPasswordKey | default "postgres-password" }}
                  {{- end }}
            - name: post_max_size
              value: {{ $php.postMaxSize | default "50M" | quote }}
            - name: upload_max_filesize
              value: {{ $php.uploadMaxFilesize | default "50M" | quote }}
            - name: client_max_body_size
              value: {{ $php.clientMaxBodySize | default "50M" | quote }}
            - name: max_input_vars
              value: {{ $php.maxInputVars | default "5000" | quote }}
            {{- if or $smtp.host (and $smtp.existingSecret $smtp.existingSecretHostKey) }}
            - name: SMTP_HOST
              {{- if and $smtp.existingSecret $smtp.existingSecretHostKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ tpl $smtp.existingSecret $ }}
                  key: {{ $smtp.existingSecretHostKey }}
              {{- else }}
              value: {{ tpl ($smtp.host | toString) $ | quote }}
              {{- end }}
            {{- end }}
            {{- if or $smtp.port (and $smtp.existingSecret $smtp.existingSecretPortKey) }}
            - name: SMTP_PORT
              {{- if and $smtp.existingSecret $smtp.existingSecretPortKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ tpl $smtp.existingSecret $ }}
                  key: {{ $smtp.existingSecretPortKey }}
              {{- else }}
              value: {{ $smtp.port | quote }}
              {{- end }}
            {{- end }}
            {{- if or $smtp.user (and $smtp.existingSecret $smtp.existingSecretUserKey) }}
            - name: SMTP_USER
              {{- if and $smtp.existingSecret $smtp.existingSecretUserKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ tpl $smtp.existingSecret $ }}
                  key: {{ $smtp.existingSecretUserKey }}
              {{- else }}
              value: {{ tpl ($smtp.user | toString) $ | quote }}
              {{- end }}
            {{- end }}
            {{- if or $smtp.password $smtp.existingSecret }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if $smtp.existingSecret }}
                  name: {{ tpl $smtp.existingSecret $ }}
                  key: {{ $smtp.existingSecretKey | default "password" }}
                  {{- else }}
                  name: {{ include "moodle.smtp.secretName" $ }}
                  key: smtp-password
                  {{- end }}
            {{- end }}
            {{- if $smtp.protocol }}
            - name: SMTP_PROTOCOL
              value: {{ $smtp.protocol | quote }}
            {{- end }}
            {{- if $mail.noreplyAddress }}
            - name: MOODLE_MAIL_NOREPLY_ADDRESS
              value: {{ $mail.noreplyAddress | quote }}
            {{- end }}
            {{- if $mail.prefix }}
            - name: MOODLE_MAIL_PREFIX
              value: {{ $mail.prefix | quote }}
            {{- end }}
            {{- if $redis.host }}
            - name: REDIS_HOST
              value: {{ tpl $redis.host $ | quote }}
            {{- if or $redis.password $redis.existingSecret }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ tpl ($redis.existingSecret | default (printf "%s-redis" (include "moodle.fullname" $))) $ }}
                  key: {{ $redis.existingSecretKey | default "redis-password" }}
            {{- end }}
            {{- end }}
            {{- if $redis.port }}
            - name: REDIS_PORT
              value: {{ $redis.port | quote }}
            {{- end }}
            - name: AUTO_UPDATE_MOODLE
              value: {{ $moodle.autoUpdateMoodle | quote }}
            {{- if hasKey ($moodle.cron | default dict) "enabled" }}
            - name: RUN_CRON_TASKS
              value: {{ ($moodle.cron).enabled | quote }}
            {{- end }}
            {{- if hasKey $moodle "debug" }}
            - name: DEBUG
              value: {{ $moodle.debug | quote }}
            {{- end }}
            {{- if $codeVolume }}
            - name: SYNC_MOODLE_CODE
              value: "never"
            {{- end }}
            {{- $preCtx := dict "Values" .Values "Release" .Release "Chart" .Chart "Capabilities" .Capabilities "Template" .Template "Files" .Files "codeVolume" $codeVolume "maxPods" $maxPods "moodle" $moodle "multiPod" $multiPod "oidc" $oidc "redis" $redis "secretConfig" $secretConfig "webRoot" $webRoot }}
            - name: PRE_CONFIGURE_COMMANDS
              value: |
                {{- tpl (.Files.Get "files/pre-configure.sh") $preCtx | nindent 16 }}
            {{- if $postConfigure }}
            - name: POST_CONFIGURE_COMMANDS
              value: |
                {{- if not $codeVolume }}
                update_or_add_config_value "\$CFG->alternative_component_cache" "/var/www/moodledata/localcache/core_component.php"
                {{- if not $moodle.allowWebPluginInstall }}
                update_or_add_config_value "\$CFG->disableupdateautodeploy" "true"
                {{- end }}
                update_or_add_config_value "\$CFG->uninstallclionly" "true"
                {{- if $redis.host }}
                update_or_add_config_value "\$CFG->session_redis_prefix" "{{ include "moodle.redis.sessionPrefix" . }}"
                {{- if $redis.database }}
                update_or_add_config_value "\$CFG->session_redis_database" "{{ $redis.database | int }}"
                {{- end }}
                {{- end }}
                {{- end }}
                {{- if $redis.host }}
                # System: keep this release's Redis keys apart from others
                php /opt/sei/custom-scripts/setup_environment.php --step=set_cache_prefix --prefix={{ include "moodle.redis.cachePrefix" . | quote }}
                {{- end }}
                {{- if $presetWanted }}
                # System: Apply the site admin preset (baseline; config and enabledPlugins override it)
                php /opt/sei/custom-scripts/setup_environment.php --step=apply_preset
                  {{- if $preset.name }} --name={{ $preset.name | quote }}{{- else }} --file={{ $presetFile | quote }}{{- end }}
                {{- end }}
                {{- if $oidc.enabled }}
                # System: Configure OIDC OAuth2
                /opt/sei/custom-scripts/configure_oidc.sh provider
                {{- end }}
                {{- if $moodle.config }}
                # System: Apply Moodle settings
                php /opt/sei/custom-scripts/setup_environment.php --step=set_configs --file=/opt/sei/config-values/config.json --secretsfile=/opt/sei/custom-scripts/config-secrets.json
                {{- end }}
                {{- if $moodle.enabledPlugins }}
                # System: Enable Moodle plugins
                php /opt/sei/custom-scripts/setup_environment.php --step=enable_plugins --file=/opt/sei/custom-scripts/enabled-plugins.json
                {{- end }}
                {{- if $moodle.postConfigureCommands }}
                # User: Custom post-configure commands
                {{ $moodle.postConfigureCommands | nindent 16 }}
                {{- end }}
                {{- if $oidc.enabled }}
                # System: Map OIDC user fields
                /opt/sei/custom-scripts/configure_oidc.sh mappings
                {{- end }}
            {{- end }}
            {{- if $oidc.enabled }}
            - name: OIDC_DISCOVERY_URL
              value: {{ tpl $oidc.discoveryUrl $ | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ $oidcClientId | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  {{- if $oidc.existingSecret }}
                  name: {{ tpl $oidc.existingSecret $ }}
                  key: {{ $oidcExistingSecretKey }}
                  {{- else }}
                  name: {{ include "moodle.oidc.secretName" $ }}
                  key: {{ $oidcExistingSecretKey }}
                  {{- end }}
            - name: OIDC_NAME
              value: {{ $oidcName | quote }}
            - name: OIDC_LOGIN_SCOPES
              value: {{ $oidc.loginScopes | quote }}
            - name: OIDC_LOGIN_SCOPES_OFFLINE
              value: {{ $oidc.loginScopesOffline | quote }}
            - name: OIDC_REQUIRE_CONFIRMATION
              value: {{ ternary "1" "0" $oidc.requireConfirmation | quote }}
            - name: OIDC_SHOW_ON_LOGIN_PAGE
              value: {{ ternary "1" "0" $oidc.showOnLoginPage | quote }}
            - name: OIDC_USER_FIELD_MAPPINGS
              value: {{ join " " $oidc.userFieldMappings | quote }}
            - name: OIDC_DISABLE_CURL_SECURITY
              value: {{ $oidc.disableCurlSecurityBlockedHosts | quote }}
            {{- if $oidcCaCertEnabled }}
            - name: OIDC_CA_CERT_PATH
              value: {{ tpl $oidcCaCertPath $ | quote }}
            {{- end }}
            {{- if $oidc.iconUrl }}
            - name: OIDC_ICON_URL
              value: {{ tpl $oidc.iconUrl $ | quote }}
            {{- end }}
            - name: OIDC_WAIT_TIMEOUT
              value: {{ $oidc.waitTimeout | quote }}
            - name: OIDC_WAIT_INTERVAL
              value: {{ $oidc.waitInterval | quote }}
            {{- end }}
          {{- if $moodle.config }}
          {{- range (fromYaml (include "moodle.config.split" $)).refs }}
            - name: {{ .env }}
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .secret $ }}
                  key: {{ .key }}
          {{- end }}
          {{- end }}
          {{- if .Values.extraEnvVars }}
            {{- include "moodle.tplvalues.render" (dict "value" $.Values.extraEnvVars "context" $) | nindent 12 }}
          {{- end }}
          {{- if or .Values.extraEnvVarsCM .Values.extraEnvVarsSecret }}
          envFrom:
            {{- if .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ .Values.extraEnvVarsCM }}
            {{- end }}
            {{- if .Values.extraEnvVarsSecret }}
            - secretRef:
                name: {{ .Values.extraEnvVarsSecret }}
            {{- end }}
          {{- end }}
          {{- if .Values.lifecycleHooks }}
          lifecycle:
            {{- include "moodle.tplvalues.render" (dict "value" $.Values.lifecycleHooks "context" $) | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $containerPorts.http | default 8080 }}
              protocol: TCP
            {{- if $containerPorts.https }}
            - name: https
              containerPort: {{ $containerPorts.https }}
              protocol: TCP
            {{- end }}
            {{- if .Values.extraContainerPorts }}
            {{- include "moodle.tplvalues.render" (dict "value" $.Values.extraContainerPorts "context" $) | nindent 12 }}
            {{- end }}
          {{- $startupProbe := .Values.startupProbe | default dict }}
          {{- if .Values.customStartupProbe }}
          startupProbe:
            {{- toYaml .Values.customStartupProbe | nindent 12 }}
          {{- else if $startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ $startupProbe.path | default "/login/index.php" }}
              port: http
              {{- if not ($moodle.proxy | default dict).reverseProxy }}
              httpHeaders:
                - name: Host
                  value: {{ (urlParse (tpl ($moodle.site).url $)).host | quote }}
              {{- end }}
            initialDelaySeconds: {{ $startupProbe.initialDelaySeconds | default 0 }}
            periodSeconds: {{ $startupProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ $startupProbe.timeoutSeconds | default 5 }}
            successThreshold: {{ $startupProbe.successThreshold | default 1 }}
            failureThreshold: {{ $startupProbe.failureThreshold | default 120 }}
          {{- end }}
          {{- $livenessProbe := .Values.livenessProbe | default dict }}
          {{- if .Values.customLivenessProbe }}
          livenessProbe:
            {{- toYaml .Values.customLivenessProbe | nindent 12 }}
          {{- else if $livenessProbe.enabled }}
          livenessProbe:
            {{- if $livenessProbe.path }}
            httpGet:
              path: {{ $livenessProbe.path }}
              port: http
            {{- else }}
            tcpSocket:
              port: http
            {{- end }}
            initialDelaySeconds: {{ $livenessProbe.initialDelaySeconds | default 120 }}
            periodSeconds: {{ $livenessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ $livenessProbe.timeoutSeconds | default 5 }}
            successThreshold: {{ $livenessProbe.successThreshold | default 1 }}
            failureThreshold: {{ $livenessProbe.failureThreshold | default 6 }}
          {{- end }}
          {{- $readinessProbe := .Values.readinessProbe | default dict }}
          {{- if .Values.customReadinessProbe }}
          readinessProbe:
            {{- toYaml .Values.customReadinessProbe | nindent 12 }}
          {{- else if $readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ $readinessProbe.path | default "/login/index.php" }}
              port: http
              {{- if not ($moodle.proxy | default dict).reverseProxy }}
              httpHeaders:
                - name: Host
                  value: {{ (urlParse (tpl ($moodle.site).url $)).host | quote }}
              {{- end }}
            initialDelaySeconds: {{ $readinessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ $readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ $readinessProbe.timeoutSeconds | default 5 }}
            successThreshold: {{ $readinessProbe.successThreshold | default 1 }}
            failureThreshold: {{ $readinessProbe.failureThreshold | default 6 }}
          {{- end }}
          {{- if .Values.resources }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- else if ne (.Values.resourcesPreset | default "none") "none" }}
          resources: {{- include "moodle.resources.preset" (dict "type" .Values.resourcesPreset) | nindent 12 }}
          {{- end }}
          {{- $persistence := .Values.persistence | default dict }}
          volumeMounts:
            {{- if $codeVolume }}
            - name: dirroot
              mountPath: /var/www/html
              readOnly: true
            {{- end }}
            {{- range $key, $value := $persistence }}
            {{- if $value.enabled }}
            {{- if not (and $codeVolume (or (eq $key "dirroot") (eq $key "moodle"))) }}
            {{- $defaultMountPath := "" }}
            {{- if eq $key "moodledata" }}
            {{- $defaultMountPath = "/var/www/moodledata" }}
            {{- else if eq $key "moodle" }}
            {{- $defaultMountPath = "/var/www/html" }}
            {{- else if eq $key "localcache" }}
            {{- $defaultMountPath = "/var/www/moodledata/localcache" }}
            {{- end }}
            - name: {{ $key }}
              mountPath: {{ $value.mountPath | default $defaultMountPath }}
              {{- if $value.subPath }}
              subPath: {{ $value.subPath }}
              {{- end }}
              {{- if $value.readOnly }}
              readOnly: {{ $value.readOnly }}
              {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $scripts }}
            - name: chart-scripts
              mountPath: /opt/sei/custom-scripts
              readOnly: true
            {{- end }}
            {{- if $moodle.config }}
            - name: config-values
              mountPath: /opt/sei/config-values
              readOnly: true
            {{- end }}
            {{- if $preset.existingConfigMap }}
            - name: preset
              mountPath: /opt/sei/preset
              readOnly: true
            {{- end }}
            {{- if and $oidc.enabled $oidcCaCertMount }}
            - name: oidc-ca-cert
              mountPath: {{ tpl $oidcCaCertPath $ | quote }}
              subPath: {{ tpl $oidcCaCertKey $ | quote }}
              readOnly: true
            {{- end }}
            {{- if $caBundleMount }}
            - name: ca-bundle
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: {{ $caBundleKey }}
              readOnly: true
            {{- end }}
            {{- if $.Values.extraVolumeMounts }}
            {{- include "moodle.tplvalues.render" (dict "value" $.Values.extraVolumeMounts "context" $) | nindent 12 }}
            {{- end }}
        {{- if .Values.sidecars }}
        {{- include "moodle.tplvalues.render" (dict "value" $.Values.sidecars "context" $) | nindent 8 }}
        {{- end }}
      volumes:
        {{- if $codeVolume }}
        - name: dirroot
          {{- if $readOnlyDirroot.volume }}
          {{- toYaml $readOnlyDirroot.volume | nindent 10 }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          secret:
            {{- if $secretConfig.name }}
            secretName: {{ tpl $secretConfig.name $ }}
            {{- else }}
            secretName: {{ include "moodle.fullname" $ }}-config
            {{- end }}
            defaultMode: 0444
            items:
              - key: {{ $configKey }}
                path: {{ $configKey }}
        {{- end }}
        {{- range $key, $value := $persistence }}
        {{- if $value.enabled }}
        {{- if not (and $codeVolume (or (eq $key "dirroot") (eq $key "moodle"))) }}
        {{- $type := $value.type | default "persistentVolumeClaim" }}
        - name: {{ $key }}
          {{- if eq $type "persistentVolumeClaim" }}
          persistentVolumeClaim:
            claimName: {{ tpl ($value.existingClaim | default (printf "%s-%s" (include "moodle.fullname" $) $key)) $ }}
          {{- else if eq $type "emptyDir" }}
          emptyDir:
            {{- if $value.medium }}
            medium: {{ $value.medium }}
            {{- end }}
            {{- if $value.sizeLimit }}
            sizeLimit: {{ $value.sizeLimit }}
            {{- end }}
          {{- else if eq $type "configMap" }}
          configMap:
            name: {{ tpl $value.name $ }}
            {{- if $value.defaultMode }}
            defaultMode: {{ $value.defaultMode }}
            {{- end }}
          {{- else if eq $type "secret" }}
          secret:
            secretName: {{ tpl $value.name $ }}
            {{- if $value.defaultMode }}
            defaultMode: {{ $value.defaultMode }}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if $caBundleMount }}
        - name: ca-bundle
          {{- if $caBundle.existingSecret }}
          secret:
            secretName: {{ tpl $caBundle.existingSecret $ }}
            items:
              - key: {{ $caBundleKey }}
                path: {{ $caBundleKey }}
          {{- else if $caBundle.existingConfigMap }}
          configMap:
            name: {{ tpl $caBundle.existingConfigMap $ }}
            items:
              - key: {{ $caBundleKey }}
                path: {{ $caBundleKey }}
          {{- end }}
        {{- end }}
        {{- if $scripts }}
        - name: chart-scripts
          configMap:
            name: {{ include "moodle.scripts.configMapName" $ }}
            defaultMode: 0755
        {{- end }}
        {{- if $moodle.config }}
        - name: config-values
          secret:
            secretName: {{ include "moodle.settings.secretName" $ }}
            defaultMode: 0444
            items:
              - key: config.json
                path: config.json
        {{- end }}
        {{- if $preset.existingConfigMap }}
        - name: preset
          configMap:
            name: {{ tpl $preset.existingConfigMap $ }}
            defaultMode: 0444
            items:
              - key: {{ $presetKey }}
                path: {{ $presetKey }}
        {{- end }}
        {{- if and $oidc.enabled $oidcCaCertMount }}
        - name: oidc-ca-cert
          {{- if $oidcCaCert.existingSecret }}
          secret:
            secretName: {{ tpl $oidcCaCert.existingSecret $ }}
            items:
              - key: {{ tpl $oidcCaCertKey $ }}
                path: {{ tpl $oidcCaCertKey $ }}
          {{- else if $oidcCaCert.existingConfigMap }}
          configMap:
            name: {{ tpl $oidcCaCert.existingConfigMap $ }}
            items:
              - key: {{ tpl $oidcCaCertKey $ }}
                path: {{ tpl $oidcCaCertKey $ }}
          {{- end }}
        {{- end }}
        {{- if $.Values.extraVolumes }}
        {{- include "moodle.tplvalues.render" (dict "value" $.Values.extraVolumes "context" $) | nindent 8 }}
        {{- end }}

{{- $moodle := .Values.moodle | default dict }}
{{- $oidc := $moodle.oidc | default dict }}
{{- $clientSecret := and $oidc.enabled (not $oidc.existingSecret) }}
{{- if $clientSecret }}
{{- $secretName := include "moodle.oidc.secretName" . }}
{{- $secretKey := $oidc.existingSecretKey | default "client-secret" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "moodle.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- include "moodle.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ $secretKey }}: {{ $oidc.clientSecret | quote }}
{{- end }}

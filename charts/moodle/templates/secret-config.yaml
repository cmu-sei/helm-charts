{{- $readOnlyDirroot := .Values.readOnlyDirroot | default dict }}
{{- $codeVolume := $readOnlyDirroot.enabled }}
{{- if and $codeVolume (not ($readOnlyDirroot.secret | default dict).name) }}
{{- $moodle := .Values.moodle | default dict }}
{{- $admin := $moodle.admin | default dict }}
{{- $site := $moodle.site | default dict }}
{{- $proxy := $moodle.proxy | default dict }}
{{- $database := $moodle.database | default dict }}
{{- $secretConfig := $readOnlyDirroot.secret | default dict }}
{{- $DB_HOST := tpl ($database.host | default "pg-postgresql") . }}
{{- $DB_NAME := tpl ($database.name | default "moodledb") . }}
{{- $DB_USER := tpl ($database.user | default "moodle") . }}
{{- $DB_PORT := $database.port | default "5432" }}
{{- $DB_PREFIX := tpl ($database.prefix | default "mdl_") . }}
{{- $SITE_URL := tpl ($site.url | default "http://localhost:8080") . }}
{{- $REVERSEPROXY := ternary $proxy.reverseProxy false (hasKey $proxy "reverseProxy") }}
{{- $SSLPROXY := ternary $proxy.sslProxy true (hasKey $proxy "sslProxy") }}
{{- $configKey := $secretConfig.key | default "config.php" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "moodle.fullname" . }}-config
  labels:
    {{- include "moodle.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- include "moodle.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ $configKey }}: |
    <?php
    unset($CFG);
    global $CFG;
    $CFG = new stdClass();

    $CFG->dbtype = "{{ $database.type }}";
    $CFG->dblibrary = "native";
    $CFG->dbhost = "{{ $DB_HOST }}";
    $CFG->dbname = "{{ $DB_NAME }}";
    $CFG->dbuser = "{{ $DB_USER }}";
    $CFG->dbpass = getenv("DB_PASS");
    $CFG->prefix = "{{ $DB_PREFIX }}";
    $CFG->dboptions = array(
      "dbpersist" => 0,
      "dbport" => {{ $DB_PORT }},
      "dbsocket" => ""
    );
    if (getenv("DB_SSLMODE")) {
        $CFG->dboptions["ssl"] = getenv("DB_SSLMODE");
    }

    $CFG->wwwroot = "{{ $SITE_URL }}";
    $CFG->dataroot = "/var/www/moodledata/";
    $CFG->admin = "admin";
    $CFG->directorypermissions = 02777;
    $CFG->reverseproxy = {{ $REVERSEPROXY }};
    $CFG->sslproxy = {{ $SSLPROXY }};
    $CFG->preventexecpath = true;
    $CFG->alternative_component_cache = "/var/www/moodledata/localcache/core_component.php";
    $CFG->disableupdateautodeploy = true;
    $CFG->uninstallclionly = true;
    $CFG->enableanalytics = false;
{{- $redis := $moodle.redis | default dict }}
{{- if $redis.host }}

    $CFG->session_handler_class = '\core\session\redis';
    $CFG->session_redis_host = "{{ tpl $redis.host . }}";
    $CFG->session_redis_port = {{ $redis.port | default 6379 }};
    $CFG->session_redis_serializer_use_igbinary = true;
    $CFG->session_redis_prefix = "{{ include "moodle.redis.sessionPrefix" . }}";
{{- if $redis.database }}
    $CFG->session_redis_database = {{ $redis.database | int }};
{{- end }}
{{- if or $redis.password $redis.existingSecret }}
    $CFG->session_redis_auth = getenv("REDIS_PASSWORD");
{{- end }}
{{- end }}

    require_once(__DIR__ . "/lib/setup.php");
{{- end }}

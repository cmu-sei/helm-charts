  name: {{ include "crucible.fullname" $ }}-topomojo-api-custom
  labels:
    {{- include "crucible.labels" $ | nindent 4 }}
type: Opaque
stringData:
  appsettings.conf: |
    {{- if not (include "crucible.userConnectionString" (dict "apiValues" $topomojoApiValues "key" "Database__ConnectionString")) }}
    Database__ConnectionString = {{ include "crucible.getDbCreds" (dict "dbConfig" $topomojoDbConfig "appName" "topomojo-api" "context" $) }}
    {{- end }}


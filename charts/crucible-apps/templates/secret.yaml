{{- $_ := set $vmLoggingDbConfig "name" "player_vm_logging" -}}
{{- $_ := set $vmLoggingDbConfig "maxPoolSize" (index $vmLoggingConfig "maxPoolSize") -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "crucible.fullname" $ }}-vm-api-custom
  labels:
    {{- include "crucible.labels" $ | nindent 4 }}
type: Opaque
stringData:
{{- if not (include "crucible.userConnectionString" (dict "apiValues" $vmApiValues "key" "ConnectionStrings__PostgreSQL")) }}
  ConnectionStrings__PostgreSQL: {{ include "crucible.getDbCreds" (dict "dbConfig" $vmDbConfig "appName" "vm-api" "context" $) | quote }}
{{- end }}
{{- if not (include "crucible.userConnectionString" (dict "apiValues" $vmApiValues "key" "VmUsageLogging__PostgreSQL")) }}
  VmUsageLogging__PostgreSQL: {{ include "crucible.getDbCreds" (dict "dbConfig" $vmLoggingDbConfig "appName" "vm-api-usage-logging" "parameters" $vmLoggingConfig.connectionParameters "context" $) | quote }}
{{- end }}


# Deploy TopoMojo
# https://github.com/cmu-sei/helm-charts/tree/main/charts/topomojo
topomojo:
  enabled: true
  topomojo-api:
    # Optional: Use a configmap to define a custom CA certificate
    # Only needed if you use self-signed certificates or corporate proxies (e.g., Zscaler)
    # You must create the ConfigMap separately before enabling this
    # Uncomment the line below to enable
    # certificateMap: "crucible-ca-cert"
    ingress:
      enabled: true
      className: ""
      hosts:
        - host: "{{ .Values.global.domain }}"
          paths:
            - path: /topomojo/(api|hub|docs)
              pathType: ImplementationSpecific
      tls:
        - hosts:
            - "{{ .Values.global.domain }}"
          secretName: ""
    storage:
      existing: "{{ .Release.Name }}-topomojo-api-nfs"
    # Database configuration
    # PostgreSQL connection details for the Topomojo database
    database:
      # PostgreSQL hostname or service name
      # Example: crucible-infra-postgresql
      host: ""
      # PostgreSQL port
      port: 5432
      # Database name
      name: "topomojo"
      # Kubernetes secret containing PostgreSQL credentials
      # The secret must contain keys for username and password
      existingSecret: ""
      # Key in the secret containing the username
      usernameKey: "username"
      # Key in the secret containing the password
      passwordKey: "password"
      # Most connections each pod opens to this database (Npgsql Maximum Pool
      # Size). See global.database for sizing; "" uses the Npgsql default (100).
      maxPoolSize: 5
      # Npgsql connection-string parameters for this app only. Each key replaces
      # the same key from maxPoolSize, global.database.connectionParameters, or
      # the default Application Name; set a key to "" to drop it.
      connectionParameters: {}
    existingSecret: "{{ .Release.Name }}-topomojo-api-custom"
    env:
      PathBase: /topomojo
      # postgres database connection string provided by secret
      Database__Provider: PostgreSQL
      FileUpload__IsoRoot: /mnt/tm
      FileUpload__TopoRoot: /mnt/tm
      FileUpload__DocRoot: /mnt/tm/_docs
      # Configure OIDC to use Keycloak
      Oidc__Authority: ""
      Oidc__Audience: topomojo
      Oidc__MetadataAddress: ""
      Oidc__RequireHttpsMetadata: false
      OpenApi__Client__AuthorizationUrl: ""
      OpenApi__Client__TokenUrl: ""
      OpenApi__Client__ClientId: topomojo.api
      Headers__Cors__Origins__0: https://{{ .Values.global.domain }}
      Headers__Forwarding__TargetHeaders: All
      # Core__ConsoleHost: "{{ .Values.global.domain }}/console"
      # Core__AllowUnprivilegedVmReconfigure: false
      # Hypervisor "Pod" Configuration (optional)
      # TopoMojo uses "Pod" terminology to refer to hypervisor connections
      # Supports both vSphere and Proxmox - specify type with Pod__HypervisorType
      # Uncomment and configure for your hypervisor
      # Pod__HypervisorType: "Vsphere"  # Options: "Vsphere" or "Proxmox"
      # Pod__Url: ""  # vSphere: https://vcenter.example.com or Proxmox: https://proxmox.example.com:8006
      # Pod__User: ""
      # Pod__Password: ""
      # Pod__ConsoleUrl: "{{ .Values.global.domain }}/console"
      # Pod__PoolPath: ""
      # Pod__Uplink: "vSwitch0"
      # Pod__VmStore: ""
      # Pod__IsoStore: ""
      # Pod__DiskStore: ""
      # Pod__TicketUrlHandler: "querystring"
      # Pod__Vlan__Range: ""
      # Pod__KeepAliveMinutes: 10
      # Pod__DebugVerbose: false
      # Proxmox-specific Pod settings (only when Pod__HypervisorType is "Proxmox")
      # Pod__AccessToken: ""  # Proxmox authentication access token
      # Pod__SDNZone: ""  # Proxmox SDN Zone for VM networking (VXLAN only)
      # Pod__Vlan__ResetDebounceDuration: 2000
      # Pod__Vlan__ResetDebounceMaxDuration: 5000
      # VMware NSX/SDDC Configuration (optional)
      # Advanced networking configuration for VMware NSX environments
      # Uncomment and configure if using NSX-T or VMware Cloud on AWS (VMC)
      # Pod__IsNsxNetwork: false
      # Pod__Sddc__ApiUrl: ""
      # Pod__Sddc__MetadataUrl: ""
      # Pod__Sddc__SegmentApiPath: "policy/api/v1/infra/tier-1s/cgw/segments"
      # Pod__Sddc__ApiKey: ""
      # Pod__Sddc__AuthUrl: ""
      # Pod__Sddc__CertificatePath: ""
      # Pod__Sddc__CertificatePassword: ""
  topomojo-ui:
    ingress:
      enabled: true
      className: ""
      hosts:
        - host: "{{ .Values.global.domain }}"
          paths:
            - path: /topomojo
              pathType: ImplementationSpecific
      tls:
        - hosts:
            - "{{ .Values.global.domain }}"
          secretName: ""
    basehref: /topomojo
    settingsYaml:
      appname: TopoMojo
      oidc:
        # Use Keycloak client configurations
        authority: "https://{{ .Values.global.domain }}/keycloak/realms/crucible"
        client_id: topomojo.ui
        redirect_uri: https://{{ .Values.global.domain }}/topomojo/oidc
        silent_redirect_uri: https://{{ .Values.global.domain }}/topomojo/oidc-silent.html
        post_logout_redirect_uri: https://{{ .Values.global.domain }}/topomojo
        response_type: code
        scope: openid profile topomojo
        automaticSilentRenew: true
        includeIdTokenInSilentRenew: false
        filterProtocolClaims: true
        loadUserInfo: true
        accessTokenExpiringNotificationTime: 120
        monitorSession: false
        useLocalStorage: true

# Deploy Moodle
moodle:
  enabled: true
  moodle:
    admin:
      # Admin username=
      username: "moodle-local-admin"
      # Admin email (defaults to "moodle-local-admin@example.com" if not set)
      # email: "moodle-local-admin@example.com"
      # Admin password will be auto-generated and preserved across upgrades
      # To use an existing secret instead:
      # existingSecret: "moodle-admin-secret"
      # existingSecretKey: "admin-password"
      # Or to set a specific password directly:
      # password: "YourSecurePassword"
    site:
      url: "https://{{ .Values.global.domain }}"
    database:
      host: ""
      name: "moodle"
      user: "postgres" # Fallback if existingSecretUserKey is not set
      existingSecret: ""
      existingSecretUserKey: "username"
      existingSecretPasswordKey: "password"
    ## OIDC OAuth2 Configuration
    oidc:
      enabled: true
      discoveryUrl: ""
      clientId: "moodle-client"
      existingSecret: ""
      existingSecretKey: "client-secret"
      name: "Crucible Keycloak"
      showOnLoginPage: true
      ## User field mappings (maps OAuth2 claims to Moodle user fields)
      userFieldMappings:
        - "preferred_username:username"
        - "given_name:firstname"
        - "family_name:lastname"
        - "email:email"
        - "sub:idnumber"
      disableCurlSecurityBlockedHosts: true
  ## Optional: private CA certificates (self-signed certificates, or a proxy such as Zscaler)
  ## Moodle chart 0.4 and later add the ConfigMap's certificates to the image's bundle, so your
  ## CA alone is enough. Chart 0.3, the version Chart.yaml pins today, mounts the file in place of the
  ## image's bundle, so there it must hold the public roots plus your CA. Create it first.
  # caBundle:
  #   existingConfigMap: "moodle-ca-bundle"
  #   key: "ca-certificates.crt"
  ingress:
    hostname: "{{ .Values.global.domain }}"
    path: /
    pathType: Prefix
    tls:
      - hosts:
          - "{{ .Values.global.domain }}"
        secretName: ""

# Crucible Application Chart Values
# This chart deploys the Crucible stack:
# Keycloak, Alloy, Blueprint, Caster, CITE, Gallery, Gameboard, Player, Steamfitter, TopoMojo, and Moodle

global:
  # Domain name for the Crucible deployment
  domain: ""
  namespace: default
  ingress:
    # Ingress controller class name used by all services.
    # Subchart ingress.className values below mirror this setting.
    # To switch ingress controllers, change this value and all className entries below.
    className: ""
    # Common annotations applied to all ingress resources (optional)
    annotations: {}
  # Database connections for the Crucible APIs. Applies to every connection
  # string this chart builds from an <app>.<app>-api.database block below
  # (Keycloak and Moodle are configured separately). A full connection string
  # set in an app's env instead (ConnectionStrings__PostgreSQL, or
  # Database__ConnectionString for Gameboard and TopoMojo) is used as given.
  #
  # Each app's connection string gets, in order of precedence (later wins):
  #   1. Application Name=<app>-api (labels its connections in pg_stat_activity)
  #   2. global.database.connectionParameters
  #   3. Maximum Pool Size=<app>.<app>-api.database.maxPoolSize, unless ""
  #   4. <app>.<app>-api.database.connectionParameters
  # Set a key to "" in a later layer to drop it and use the Npgsql default.
  #
  # Pool sizing: Npgsql opens up to Maximum Pool Size connections per pod
  # (default 100), so without a cap the APIs together can ask for far more
  # connections than PostgreSQL allows, and requests then fail with "53300:
  # remaining connection slots are reserved". The defaults fit a stock
  # PostgreSQL (max_connections 100) with room left for Keycloak and Moodle:
  # CITE, Gallery, and Player 12 per pod; VM API, Blueprint, and Gameboard 8;
  # Alloy, Caster, Steamfitter, and TopoMojo 5; VM usage logging 3. That is 83
  # in all with one replica each. Keep the sum of maxPoolSize x replicas, plus
  # Keycloak and Moodle, below the server's max_connections. For a big
  # deployment, raise max_connections on the server and then raise the busy
  # apps' maxPoolSize. The crucible-infra chart's CNPG cluster runs with
  # PostgreSQL's default of 100 and has no max_connections setting yet.
  # "Maximum Pool Size: 10" here caps every app at 10.
  database:
    # Npgsql connection-string parameters added to every app connection string.
    # Keys are Npgsql keywords: https://www.npgsql.org/doc/connection-string-parameters.html
    connectionParameters:
      # Close pooled connections idle for this many seconds (Npgsql default:
      # 300), so connections opened for a burst go back to the server quickly
      Connection Idle Lifetime: 60
      # Seconds to wait for a connection, including waiting for a free one in
      # the app's pool (Npgsql default: 15), so a burst queues instead of failing
      Timeout: 30

# Deploy Keycloak IdP (via Keycloak Operator)
# https://www.keycloak.org/operator/installation
keycloak:
  enabled: true
  instances: 1
  ingress:
    enabled: true
    ingressClassName: ""
    tlsSecretName: ""
    annotations: {}
      # nginx example for redirecting root path to admin console in the crucible realm:
      # nginx.ingress.kubernetes.io/server-snippet: |
      #   location ~ ^/keycloak/?$ {
      #     return 302 $scheme://$host/keycloak/admin/crucible/console/;
      #   }
  # Automatically create and import a realm with dynamically generated client secrets.
  # When true, the chart generates unique OIDC client secrets, creates a realm Secret,
  # and configures Keycloak to import it on startup.
  # Mutually exclusive with importRealmSecret.
  createRealm: false

  # Password for the "admin" user in the crucible realm (only used when createRealm is true).
  # If empty, a random 16-character password is generated and persisted across upgrades.
  # Useful for development when you want a known password.
  realmAdminPassword: ""
  # Username for the default admin user in the Keycloak realm (only used when createRealm is true).
  realmAdminUsername: "admin"
  # Email address for the default admin user in the Keycloak realm (only used when createRealm is true).
  realmAdminEmail: "admin@crucible.dev"
  # Import a realm from an existing Secret (must contain a "realm.json" key).
  importRealmSecret: ""
  # Database configuration
  externalDatabase:
    # PostgreSQL hostname or service name
    # Example: crucible-infra-postgresql
    host: ""
    port: 5432
    database: keycloak
    # Kubernetes secret containing PostgreSQL credentials
    # The secret must contain keys for username and password
    existingSecret: ""
    # Key in the secret containing the username
    existingSecretUserKey: "username"
    # Key in the secret containing the password
    existingSecretPasswordKey: "password"

alloy:
  enabled: true
  alloy-api:
    ingress:
      className: ""
      hosts:
        - host: "{{ .Values.global.domain }}"
          paths:
            - path: /alloy/(api|swagger|hubs)
              pathType: ImplementationSpecific
      tls:
        - hosts:
            - "{{ .Values.global.domain }}"
          secretName: ""
    # Database configuration
    # PostgreSQL connection details for the Alloy database
    database:
      # PostgreSQL hostname or service name
      # Example: crucible-infra-postgresql
      host: ""
      # PostgreSQL port
      port: 5432
      # Database name
      name: "alloy"
      # Kubernetes secret containing PostgreSQL credentials
      # The secret must contain keys for username and password
      existingSecret: ""
      # Key in the secret containing the username
      usernameKey: "username"
      # Key in the secret containing the password
      passwordKey: "password"
      # Most connections each pod opens to this database (Npgsql Maximum Pool
      # Size). See global.database for sizing; "" uses the Npgsql default (100).
      maxPoolSize: 5
      # Npgsql connection-string parameters for this app only. Each key replaces
      # the same key from maxPoolSize, global.database.connectionParameters, or
      # the default Application Name; set a key to "" to drop it.
      connectionParameters: {}
    # This secret contains the postgres connection string and OAuth credentials
    existingSecret: "{{ .Release.Name }}-alloy-api-custom"
    # Values placed into the {{ .Release.Name }}-alloy-api-custom secret
    resourceOwnerAuthorization:
      authority: "https://{{ .Values.global.domain }}/keycloak/realms/crucible"
      clientId: "alloy.admin"
      clientSecret: "" # OAuth client secret from Keycloak
      userName: "" # Service account username
      password: "" # Service account password
    env:
      PathBase: /alloy
      # CORS policy settings.
      CorsPolicy__Origins__0: "https://{{ .Values.global.domain }}"
      # OAuth2 Identity Client for Application
      Authorization__Authority: "https://{{ .Values.global.domain }}/keycloak/realms/crucible"
      Authorization__AuthorizationUrl: "https://{{ .Values.global.domain }}/keycloak/realms/crucible/protocol/openid-connect/auth"
      Authorization__TokenUrl: "https://{{ .Values.global.domain }}/keycloak/realms/crucible/protocol/openid-connect/token"
      Authorization__AuthorizationScope: "openid alloy player player-vm steamfitter caster"
      Authorization__ClientId: alloy.api
      Authorization__ClientName: "Alloy API"
      # OAuth2 Identity Client /w Password
      ResourceOwnerAuthorization__Authority: "https://{{ .Values.global.domain }}/keycloak/realms/crucible"
      ResourceOwnerAuthorization__ClientId: alloy.admin
      ResourceOwnerAuthorization__UserName: ""
      ResourceOwnerAuthorization__Scope: "openid alloy player player-vm caster steamfitter"
      # Crucible Application URLs
      ClientSettings__urls__playerApi: "https://{{ .Values.global.domain }}/player"
      ClientSettings__urls__casterApi: "https://{{ .Values.global.domain }}/caster"
      ClientSettings__urls__steamfitterApi: "https://{{ .Values.global.domain }}/steamfitter"

  alloy-ui:
    ingress:
      className: ""
      hosts:
        - host: "{{ .Values.global.domain }}"
          paths:
            - path: /alloy
              pathType: ImplementationSpecific
      tls:
        - hosts:
            - "{{ .Values.global.domain }}"
          secretName: ""
    env:
      APP_BASEHREF: /alloy
    settings: '{
      "ApiUrl": "https://{{ .Values.global.domain }}/alloy",
      "OIDCSettings": {
      "authority": "",
      "client_id": "alloy.ui",
      "redirect_uri": "https://{{ .Values.global.domain }}/alloy/auth-callback",
      "post_logout_redirect_uri": "https://{{ .Values.global.domain }}/alloy",
      "response_type": "code",
      "scope": "openid profile alloy player player-vm caster steamfitter",
      "automaticSilentRenew": true,
      "silent_redirect_uri": "https://{{ .Values.global.domain }}/alloy/auth-callback-silent.html"
      },
      "AppTitle": "Alloy",
      "AppTopBarText": "Alloy",
      "PlayerUIAddress": "https://{{ .Values.global.domain }}/player",
      "UseLocalAuthStorage": true
      }'

# Deploy Blueprint
# https://github.com/cmu-sei/helm-charts/tree/main/charts/blueprint
blueprint:
  enabled: true
  blueprint-api:
    # Optional: Use a configmap to define a custom CA certificate
    # Only needed if you use self-signed certificates or corporate proxies (e.g., Zscaler)
    # You must create the ConfigMap separately before enabling this
    # Uncomment the line below to enable
    # certificateMap: "crucible-ca-cert"
    ingress:
      className: ""
      hosts:
        - host: "{{ .Values.global.domain }}"
          paths:
            - path: /blueprint/(api|swagger|hubs)
              pathType: ImplementationSpecific
      tls:
        - hosts:
            - "{{ .Values.global.domain }}"
          secretName: ""
    # This secret contains the postgres connection string
    # Database configuration
    # PostgreSQL connection details for the Blueprint database
    database:
      # PostgreSQL hostname or service name
      # Example: crucible-infra-postgresql
      host: ""
      # PostgreSQL port
      port: 5432
      # Database name
      name: "blueprint"
      # Kubernetes secret containing PostgreSQL credentials
      # The secret must contain keys for username and password
      existingSecret: ""
      # Key in the secret containing the username
      usernameKey: "username"
      # Key in the secret containing the password
      passwordKey: "password"
      # Most connections each pod opens to this database (Npgsql Maximum Pool
      # Size). See global.database for sizing; "" uses the Npgsql default (100).
      maxPoolSize: 8
      # Npgsql connection-string parameters for this app only. Each key replaces
      # the same key from maxPoolSize, global.database.connectionParameters, or
      # the default Application Name; set a key to "" to drop it.
      connectionParameters: {}
    existingSecret: "{{ .Release.Name }}-blueprint-api-custom"
    # Values placed into the {{ .Release.Name }}-blueprint-api-custom secret
    resourceOwnerAuthorization:
      authority: "https://{{ .Values.global.domain }}/keycloak/realms/crucible"
      clientId: "blueprint.admin"
      clientSecret: "" # OAuth client secret from Keycloak
      userName: "" # Service account username
      password: "" # Service account password
    env:
      PathBase: /blueprint
      # CORS policy settings
      CorsPolicy__Origins__0: https://{{ .Values.global.domain }}
      # OAuth2 Identity Client for Application
      Authorization__Authority: "https://{{ .Values.global.domain }}/keycloak/realms/crucible"
      Authorization__AuthorizationUrl: "https://{{ .Values.global.domain }}/keycloak/realms/crucible/protocol/openid-connect/auth"
      Authorization__TokenUrl: "https://{{ .Values.global.domain }}/keycloak/realms/crucible/protocol/openid-connect/token"
      Authorization__AuthorizationScope: "openid blueprint player player-vm cite gallery steamfitter caster"
      Authorization__ClientId: blueprint.api
      Authorization__ClientName: "Blueprint API"
      # Resource Owner Authorization for service account
      ResourceOwnerAuthorization__Authority: "https://{{ .Values.global.domain }}/keycloak/realms/crucible"
      ResourceOwnerAuthorization__ClientId: blueprint.admin
      ResourceOwnerAuthorization__Scope: "openid profile blueprint player player-vm cite gallery steamfitter caster"
      # Client Settings for other Crucible services
      ClientSettings__CiteApiUrl: https://{{ .Values.global.domain }}/cite
      ClientSettings__GalleryApiUrl: https://{{ .Values.global.domain }}/gallery
      ClientSettings__PlayerApiUrl: https://{{ .Values.global.domain }}/player
      ClientSettings__SteamfitterApiUrl: https://{{ .Values.global.domain }}/steamfitter
      ClientSettings__CasterApiUrl: https://{{ .Values.global.domain }}/caster
      # UI addresses for the Player application URL placeholders {casterUrl} and {vmUrl}
      ClientSettings__CasterUiUrl: https://{{ .Values.global.domain }}/caster
      ClientSettings__VmUiUrl: https://{{ .Values.global.domain }}/vm
      # Database settings
      Database__AutoMigrate: true
      Database__DevModeRecreate: false
      # Optional: Trust a custom CA certificate
      # Only needed if you use self-signed certificates or corporate proxies (e.g., Zscaler)
      # Uncomment and adjust paths to match your certificateMap configuration
      # SSL_CERT_FILE: /usr/local/share/ca-certificates/crucible-dev.crt
      # SSL_CERT_DIR: /usr/local/share/ca-certificates
  blueprint-ui:
    ingress:
      className: ""
      hosts:
        - host: "{{ .Values.global.domain }}"
          paths:
            - path: /blueprint
              pathType: ImplementationSpecific
      tls:
        - hosts:
            - "{{ .Values.global.domain }}"
          secretName: ""
    env:
      APP_BASEHREF: /blueprint
    settingsYaml:
      ApiUrl: https://{{ .Values.global.domain }}/blueprint
      GalleryApiUrl: https://{{ .Values.global.domain }}/gallery
      PlayerUrl: https://{{ .Values.global.domain }}/player
      CasterUrl: https://{{ .Values.global.domain }}/caster
      VmUrl: https://{{ .Values.global.domain }}/vm
      OIDCSettings:
        authority: "https://{{ .Values.global.domain }}/keycloak/realms/crucible"
        client_id: blueprint.ui
        redirect_uri: https://{{ .Values.global.domain }}/blueprint/auth-callback
        post_logout_redirect_uri: https://{{ .Values.global.domain }}/blueprint
        response_type: code
        scope: openid profile blueprint player player-vm cite gallery steamfitter caster
        automaticSilentRenew: true
        silent_redirect_uri: https://{{ .Values.global.domain }}/blueprint/auth-callback-silent.html
      AppTitle: Blueprint
      AppTopBarText: "Blueprint  -  Exercise Planning"
      AppTopBarImage: /blueprint/assets/img/pencil-ruler-white.png
      UseLocalAuthStorage: false

# Deploy Caster
# https://github.com/cmu-sei/helm-charts/tree/main/charts/caster
caster:
  enabled: true
  caster-api:
    # Optional: Use a configmap to define a custom CA certificate
    # Only needed if you use self-signed certificates or corporate proxies (e.g., Zscaler)
    # You must create the ConfigMap separately before enabling this
    # Uncomment the line below to enable
    # certificateMap: "crucible-ca-cert"
    # Git credentials - placeholder for local development
    gitcredentials: ""
    ingress:
      className: ""
      hosts:
        - host: "{{ .Values.global.domain }}"
          paths:
            - path: /caster/(api|swagger|hubs)
              pathType: ImplementationSpecific
      tls:
        - hosts:
            - "{{ .Values.global.domain }}"
          secretName: ""
    storage:
      existing: "{{ .Release.Name }}-caster-api-nfs"
    # This secret contains the postgres connection string
    # Database configuration
    # PostgreSQL connection details for the Caster database
    database:
      # PostgreSQL hostname or service name
      # Example: crucible-infra-postgresql
      host: ""
      # PostgreSQL port
      port: 5432
      # Database name
      name: "caster"
      # Kubernetes secret containing PostgreSQL credentials
      # The secret must contain keys for username and password
      existingSecret: ""
      # Key in the secret containing the username
      usernameKey: "username"
      # Key in the secret containing the password
      passwordKey: "password"
      # Most connections each pod opens to this database (Npgsql Maximum Pool
      # Size). See global.database for sizing; "" uses the Npgsql default (100).
      maxPoolSize: 5
      # Npgsql connection-string parameters for this app only. Each key replaces
      # the same key from maxPoolSize, global.database.connectionParameters, or
      # the default Application Name; set a key to "" to drop it.
      connectionParameters: {}
    existingSecret: "{{ .Release.Name }}-caster-api-custom"
    # Values placed into the {{ .Release.Name }}-caster-api-custom secret
    client:
      userName: "" # Service account username
      password: "" # Service account password
    env:
      PathBase: /caster
      # Use Keycloak client configurations
      Authorization__Authority: "https://{{ .Values.global.domain }}/keycloak/realms/crucible"
      Authorization__AuthorizationUrl: "https://{{ .Values.global.domain }}/keycloak/realms/crucible/protocol/openid-connect/auth"
      Authorization__TokenUrl: "https://{{ .Values.global.domain }}/keycloak/realms/crucible/protocol/openid-connect/token"
      Authorization__AuthorizationScope: "caster"
      Authorization__ClientId: caster.api
      CorsPolicy__Origins__0: https://{{ .Values.global.domain }}
      # Resource Owner Authorization for service account
      Client__TokenUrl: "https://{{ .Values.global.domain }}/keycloak/realms/crucible/protocol/openid-connect/token"
      Client__ClientId: caster.admin
      Client__Scope: "player player-vm"
      # Crucible Player URLs
      Player__VmApiUrl: https://{{ .Values.global.domain }}/vm
      Player__VmConsoleUrl: https://{{ .Values.global.domain }}/console/vm/{id}/console
      # VMware vSphere Configuration (optional)
      # Caster uses Terraform with the vSphere provider to manage infrastructure
      # Uncomment and configure if using VMware vSphere
      # VSPHERE_SERVER: "vcenter.example.com"
      # VSPHERE_USER: "caster-account@vsphere.local"
      # VSPHERE_PASSWORD: ""
      # VSPHERE_ALLOW_UNVERIFIED_SSL: true
      # Optional: Trust a custom CA certificate
      # Only needed if you use self-signed certificates or corporate proxies (e.g., Zscaler)
      # Uncomment and adjust paths to match your certificateMap configuration
      # SSL_CERT_FILE: /usr/local/share/ca-certificates/crucible-dev.crt
      # SSL_CERT_DIR: /usr/local/share/ca-certificates
  caster-ui:
    ingress:
      className: ""
      hosts:
        - host: "{{ .Values.global.domain }}"
          paths:
            - path: /caster
              pathType: ImplementationSpecific
      tls:
        - hosts:
            - "{{ .Values.global.domain }}"
          secretName: ""
    env:
      APP_BASEHREF: /caster
    settingsYaml:
      ApiUrl: https://{{ .Values.global.domain }}/caster
      OIDCSettings:
        authority: "https://{{ .Values.global.domain }}/keycloak/realms/crucible"
        client_id: caster.ui
        redirect_uri: https://{{ .Values.global.domain }}/caster/auth-callback
        post_logout_redirect_uri: https://{{ .Values.global.domain }}/caster
        response_type: code
        scope: openid profile caster
        automaticSilentRenew: true
        silent_redirect_uri: https://{{ .Values.global.domain }}/caster/auth-callback-silent.html
      UseLocalAuthStorage: true


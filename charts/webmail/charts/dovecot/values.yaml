replicaCount: 1

image:
  repository: cwdoe.azurecr.us/dovecot
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

podAnnotations: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  requests:
    cpu: 50m
    memory: 32Mi

# Container ports to declare, for example:
#   - containerPort: 143
#     name: imap
ports: []

# Volumes to mount in the container, for example:
#   - mountPath: /var/mail
#     name: mail
#     subPath: mail
volumeMounts: []

# Volumes for the pod (each a PersistentVolumeClaim), for example:
#   - name: mail
#     persistentVolumeClaim:
#       claimName: webmail-mail
volumes: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  DB_HOST:
  DB_PASSWORD: ""
  DB_USER: ""
  DES_KEY: ""
